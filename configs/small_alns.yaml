experiment_name: small_alns_validation
instance_path: data/small/instance_001
solver: alns
experiment_type: alns_multiobjective

objective:
  mode: weighted
  emission_factor_dv: 3.0
  emission_factor_od: 1.0
  lambda_values: [0.0, 0.5, 1.0]

alns:
  runs: 30
  iterations: 30000
  seed: 42
  cooling_rate: 0.9994
  segment_length: 300
  reaction_factor: 0.1

output:
  root_dir: outputs
  save_solution_details: true
  save_charts: true
  save_instance_snapshot: true
